name: Card Variance

on:
  workflow_dispatch:
    inputs:
      repeats:
        description: "Measured runs for variance benchmark"
        required: false
        default: "7"
        type: choice
        options:
          - "7"
          - "10"
      warmup_runs:
        description: "Warmup runs discarded before measurement"
        required: false
        default: "2"
        type: choice
        options:
          - "1"
          - "2"
      min_repeats:
        description: "Minimum repeats required by CI quality check"
        required: false
        default: "7"
        type: choice
        options:
          - "5"
          - "7"
      stable_scroll_profile:
        description: "Use stable deterministic scroll profile"
        required: false
        default: "false"
        type: choice
        options:
          - "false"
          - "true"
      scroll_input_mode:
        description: "Scroll input mode used by benchmark runner"
        required: false
        default: "jump"
        type: choice
        options:
          - "jump"
          - "drag"
      scroll_jump_profile:
        description: "Jump target profile used when scroll_input_mode=jump"
        required: false
        default: "edge_bounce"
        type: choice
        options:
          - "edge_bounce"
          - "relative"
      scroll_step_px:
        description: "Per-step scroll delta in px used by benchmark runner"
        required: false
        default: "-280"
        type: choice
        options:
          - "-240"
          - "-260"
          - "-280"
          - "-300"
          - "-320"
      enforce_max_jank_cv:
        description: "Fail workflow when jank CV exceeds threshold"
        required: false
        default: "false"
        type: choice
        options:
          - "false"
          - "true"
      max_jank_cv:
        description: "Max allowed jank CV percent when enforcement is on"
        required: false
        default: "30"
        type: choice
        options:
          - "30"
          - "40"
          - "60"
          - "70"
          - "80"
      enforce_max_jank_mad:
        description: "Fail workflow when jank MAD/median exceeds threshold"
        required: false
        default: "false"
        type: choice
        options:
          - "false"
          - "true"
      max_jank_mad:
        description: "Max allowed jank MAD/median percent when enforcement is on"
        required: false
        default: "30"
        type: choice
        options:
          - "20"
          - "30"
          - "40"
      decision_mode:
        description: "Final variance decision mode for CI summary/enforcement"
        required: false
        default: "cv_and_mad"
        type: choice
        options:
          - "cv_and_mad"
          - "cv_or_mad"
          - "cv"
          - "mad"
      enforce_variance_decision:
        description: "Fail workflow when decision_mode evaluates to fail"
        required: false
        default: "true"
        type: choice
        options:
          - "true"
          - "false"

jobs:
  card-variance:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      BENCH_SCENARIO: dynamic_card_50k
      BENCH_DEVICE: linux
      BENCH_REPEATS: ${{ inputs.repeats }}
      BENCH_WARMUP_RUNS: ${{ inputs.warmup_runs }}
      BENCH_MIN_REPEATS: ${{ inputs.min_repeats }}
      BENCH_STABLE_SCROLL_PROFILE: ${{ inputs.stable_scroll_profile }}
      BENCH_SCROLL_INPUT_MODE: ${{ inputs.scroll_input_mode }}
      BENCH_SCROLL_JUMP_PROFILE: ${{ inputs.scroll_jump_profile }}
      BENCH_SCROLL_STEP_PX: ${{ inputs.scroll_step_px }}
      ENFORCE_MAX_JANK_CV: ${{ inputs.enforce_max_jank_cv }}
      MAX_JANK_CV: ${{ inputs.max_jank_cv }}
      ENFORCE_MAX_JANK_MAD: ${{ inputs.enforce_max_jank_mad }}
      MAX_JANK_MAD: ${{ inputs.max_jank_mad }}
      VARIANCE_DECISION_MODE: ${{ inputs.decision_mode }}
      ENFORCE_VARIANCE_DECISION: ${{ inputs.enforce_variance_decision }}
      CI_OUT_DIR: benchmarks/results/ci/${{ github.run_id }}/card_variance
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Enable Linux desktop
        run: flutter config --enable-linux-desktop

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev xvfb jq python3

      - name: Install Dart/Flutter dependencies
        run: flutter pub get

      - name: Run card variance CI script
        run: |
          chmod +x benchmarks/ci/run_card_variance_ci.sh
          xvfb-run -a benchmarks/ci/run_card_variance_ci.sh

      - name: Upload card variance artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: card-variance-${{ github.run_id }}
          path: |
            benchmarks/results/ci/${{ github.run_id }}/card_variance/
          if-no-files-found: warn
